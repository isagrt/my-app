<div class="filters">
  <button mat-button (click)="filtroSelecionado='todos'">Todos</button>
  <button mat-button (click)="filtroSelecionado='html'">HTML</button>
  <button mat-button (click)="filtroSelecionado='css'">CSS</button>
  <button mat-button (click)="filtroSelecionado='react'">React</button>
  <button mat-button (click)="filtroSelecionado='angular'">Angular</button>
</div>

<div class="cards-grid">
  <mat-card
    class="course-card"
    *ngFor="let curso of cursosFiltrados"
  >
    <mat-card-header>
      <mat-card-title>{{ curso.titulo }}</mat-card-title>
    </mat-card-header>

    <img mat-card-image [src]="curso.imagem" alt="{{ curso.titulo }}" />

    <mat-card-content>
      <p>{{ curso.descricao }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-icon-button>
        <mat-icon>bookmark</mat-icon>
      </button>
      <button mat-icon-button>
        <mat-icon>play_circle</mat-icon>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
